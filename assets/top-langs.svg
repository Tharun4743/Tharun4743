<svg
  width="300"
  height="190"
  viewBox="0 0 300 190"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #70a5fd;
      animation: fadeInAnimation 0.8s ease-in-out forwards;
    }
    .lang-name {
      font: 400 11px "Segoe UI", Ubuntu, Sans-Serif;
      fill: #38bdae;
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }
    @keyframes fadeInAnimation {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>

  <rect
    x="0.5"
    y="0.5"
    rx="4.5"
    height="99%"
    width="299"
    fill="#1a1b27"
    stroke-opacity="0"
  />

  <g transform="translate(25, 35)">
    <text x="0" y="0" class="header">Most Used Languages</text>
  </g>

  <g transform="translate(0, 55)">
    <svg x="25">
      <mask id="rect-mask">
        <rect x="0" y="0" width="250" height="8" fill="white" rx="5"/>
      </mask>
      <rect mask="url(#rect-mask)" x="0.00" y="0" width="193.50" height="8" fill="#3178c6" /><rect mask="url(#rect-mask)" x="193.50" y="0" width="21.25" height="8" fill="#f1e05a" /><rect mask="url(#rect-mask)" x="214.75" y="0" width="11.25" height="8" fill="#b07219" /><rect mask="url(#rect-mask)" x="226.00" y="0" width="5.75" height="8" fill="#663399" /><rect mask="url(#rect-mask)" x="231.75" y="0" width="4.25" height="8" fill="#3572A5" /><rect mask="url(#rect-mask)" x="236.00" y="0" width="2.75" height="8" fill="#e34c26" />
      <g transform="translate(0, 25)">
        <g transform="translate(0, 0)">
          <g transform="translate(0, 0)">
      <g class="stagger" style="animation-delay: 450ms">
        <circle cx="5" cy="6" r="5" fill="#3178c6" />
        <text x="15" y="10" class="lang-name">TypeScript 77.40%</text>
      </g>
    </g><g transform="translate(0, 25)">
      <g class="stagger" style="animation-delay: 600ms">
        <circle cx="5" cy="6" r="5" fill="#f1e05a" />
        <text x="15" y="10" class="lang-name">JavaScript 8.50%</text>
      </g>
    </g><g transform="translate(0, 50)">
      <g class="stagger" style="animation-delay: 750ms">
        <circle cx="5" cy="6" r="5" fill="#b07219" />
        <text x="15" y="10" class="lang-name">Java 4.50%</text>
      </g>
    </g>
        </g>
        <g transform="translate(140, 0)">
          <g transform="translate(0, 0)">
      <g class="stagger" style="animation-delay: 900ms">
        <circle cx="5" cy="6" r="5" fill="#663399" />
        <text x="15" y="10" class="lang-name">CSS 2.30%</text>
      </g>
    </g><g transform="translate(0, 25)">
      <g class="stagger" style="animation-delay: 1050ms">
        <circle cx="5" cy="6" r="5" fill="#3572A5" />
        <text x="15" y="10" class="lang-name">Python 1.70%</text>
      </g>
    </g><g transform="translate(0, 50)">
      <g class="stagger" style="animation-delay: 1200ms">
        <circle cx="5" cy="6" r="5" fill="#e34c26" />
        <text x="15" y="10" class="lang-name">HTML 1.10%</text>
      </g>
    </g>
        </g>
      </g>
    </svg>
  </g>
</svg>