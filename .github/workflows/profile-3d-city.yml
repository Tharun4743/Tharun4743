name: GitHub Profile 3D City

on:
  schedule:
    - cron: "0 0,6,12,18 * * *" # Runs every 6 hours
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-3d-city
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate 3D Contribution City
        uses: Tharun4743/github-profile-3d-city@v1
        with:
          username: ${{ github.repository_owner }}
          theme: 'cyberpunk'
          output-dir: 'profile-3d-contrib'
          filename: 'profile-3d-city.svg'
          generate-all: 'true'

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if git diff --cached --quiet; then
            echo "No 3D city changes to commit."
          else
            git commit -m "chore: update 3D contribution city skyline [skip ci]"
            git pull --rebase origin main
            git push
          fi
