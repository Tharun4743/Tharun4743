
name: Update GitHub Stats & Contribution SVGs

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate Dark Contribution Calendar SVG
        run: |
          python -c '
          import urllib.request, re
          url = "https://github.com/users/Tharun4743/contributions"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          html = urllib.request.urlopen(req).read().decode("utf-8")
          pattern = r"data-date=\"(\d{4}-\d{2}-\d{2})\"[^>]*data-level=\"(\d+)\""
          matches = re.findall(pattern, html)
          if not matches:
              pattern2 = r"data-level=\"(\d+)\"[^>]*data-date=\"(\d{4}-\d{2}-\d{2})\""
              matches = [(m[1], m[0]) for m in re.findall(pattern2, html)]
          months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"]
          colors = ["#161b22", "#0e4429", "#006d32", "#26a641", "#39d353"]
          width, height = 53 * 13 + 40, 7 * 13 + 55
          lines = [f"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"{width}\" height=\"{height}\" viewBox=\"0 0 {width} {height}\" fill=\"none\">", "<style>.month-text { font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif; font-size: 10px; fill: #8b949e; } .wday-text { font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif; font-size: 9px; fill: #8b949e; } .day-rect { rx: 2px; ry: 2px; }</style>", "<rect width=\"100%\" height=\"100%\" fill=\"#0d1117\" rx=\"6\" />"]
          col = row = 0
          prev_month = None
          m_headers = []
          for date_str, lvl_str in matches:
              l = int(lvl_str)
              c = colors[min(l, 4)]
              y, x = 25 + row * 13, 30 + col * 13
              lines.append(f"<rect class=\"day-rect\" x=\"{x}\" y=\"{y}\" width=\"10\" height=\"10\" fill=\"{c}\" />")
              m_num = int(date_str.split("-")[1])
              if prev_month != m_num:
                  prev_month = m_num
                  m_headers.append((x, months[m_num - 1]))
              row += 1
              if row > 6: row = 0; col += 1
          seen = set()
          for x, m in m_headers:
              if m not in seen:
                  seen.add(m)
                  lines.append(f"<text x=\"{x}\" y=\"15\" class=\"month-text\">{m}</text>")
          lines.append("<text x=\"10\" y=\"34\" class=\"wday-text\">Mon</text>")
          lines.append("<text x=\"10\" y=\"60\" class=\"wday-text\">Wed</text>")
          lines.append("<text x=\"10\" y=\"86\" class=\"wday-text\">Fri</text>")
          lines.append(f"<g transform=\"translate({width-150}, {height-18})\"><text x=\"0\" y=\"9\" class=\"wday-text\">Less</text>")
          for idx, c in enumerate(colors):
              lines.append(f"<rect x=\"{28+idx*13}\" y=\"0\" width=\"10\" height=\"10\" fill=\"{c}\" class=\"day-rect\"/>")
          lines.append("<text x=\"98\" y=\"9\" class=\"wday-text\">More</text></g></svg>")
          with open("assets/contribution-calendar-dark.svg", "w") as f: f.write("\n".join(lines))
          '

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=Tharun4743&show_icons=true&theme=tokyonight&hide_border=true&count_private=true&include_all_commits=true&rank_icon=github"
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=Tharun4743&layout=compact&theme=tokyonight&hide_border=true&langs_count=8"
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Snake Contribution Animation
        uses: Platane/snk@v3
        with:
          github_user_name: Tharun4743
          outputs: |
            assets/github-contribution-grid-snake.svg
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit and push SVGs
        run: |
          mkdir -p assets
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/top-langs.svg assets/contribution-calendar-dark.svg assets/github-contribution-grid-snake.svg assets/github-contribution-grid-snake-dark.svg
          git diff --cached --quiet || git commit -m "chore: update github stats & contribution svgs"
          git push
