name: Update GitHub Stats & Contribution SVGs

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate Contribution Calendar & GitHub Stats SVGs with Real Data
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.API_KEY || secrets.METRICS_TOKEN || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python -c '
          import urllib.request, json, re, os

          token = os.environ.get("GH_TOKEN", "")
          headers = {"User-Agent": "Mozilla/5.0"}
          if token:
              headers["Authorization"] = f"Bearer {token}"

          # 1. Contribution Calendar
          url = "https://github.com/users/Tharun4743/contributions"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          html = urllib.request.urlopen(req).read().decode("utf-8")
          pattern = r"data-date=\"(\d{4}-\d{2}-\d{2})\"[^>]*data-level=\"(\d+)\""
          matches = re.findall(pattern, html)
          if not matches:
              pattern2 = r"data-level=\"(\d+)\"[^>]*data-date=\"(\d{4}-\d{2}-\d{2})\""
              matches = [(m[1], m[0]) for m in re.findall(pattern2, html)]
          matches.sort(key=lambda x: x[0])
          months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"]
          colors = ["#161b22", "#0e4429", "#006d32", "#26a641", "#39d353"]
          box_size, gap, step = 11, 3, 14
          left_offset, top_offset = 35, 28
          weeks_count = (len(matches) + 6) // 7
          width = left_offset + weeks_count * step + 15
          height = top_offset + 7 * step + 25
          lines = [f"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"{width}\" height=\"{height}\" viewBox=\"0 0 {width} {height}\" fill=\"none\">", "<style>.month-text { font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif; font-size: 10px; fill: #8b949e; font-weight: 500; } .wday-text { font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif; font-size: 9px; fill: #8b949e; } .day-rect { rx: 2px; ry: 2px; }</style>", "<rect width=\"100%\" height=\"100%\" fill=\"#0d1117\" rx=\"6\" />"]
          columns = []
          curr_col = []
          for item in matches:
              curr_col.append(item)
              if len(curr_col) == 7: columns.append(curr_col); curr_col = []
          if curr_col: columns.append(curr_col)
          month_headers = []
          last_m = None
          for c_idx, col_days in enumerate(columns):
              first_date = col_days[0][0]
              m_num = int(first_date.split("-")[1])
              if m_num != last_m:
                  x_pos = left_offset + c_idx * step
                  if not month_headers or (x_pos - month_headers[-1][0] >= 25):
                      month_headers.append((x_pos, months[m_num - 1]))
                      last_m = m_num
          for x_pos, m_name in month_headers:
              lines.append(f"<text x=\"{x_pos}\" y=\"18\" class=\"month-text\">{m_name}</text>")
          for c_idx, col_days in enumerate(columns):
              for r_idx, (date_str, lvl_str) in enumerate(col_days):
                  l = int(lvl_str)
                  c = colors[min(l, 4)]
                  x, y = left_offset + c_idx * step, top_offset + r_idx * step
                  lines.append(f"<rect class=\"day-rect\" x=\"{x}\" y=\"{y}\" width=\"{box_size}\" height=\"{box_size}\" fill=\"{c}\"><title>{l} contributions on {date_str}</title></rect>")
          lines.append(f"<text x=\"10\" y=\"{top_offset + 1 * step + 9}\" class=\"wday-text\">Mon</text>")
          lines.append(f"<text x=\"10\" y=\"{top_offset + 3 * step + 9}\" class=\"wday-text\">Wed</text>")
          lines.append(f"<text x=\"10\" y=\"{top_offset + 5 * step + 9}\" class=\"wday-text\">Fri</text>")
          legend_x, legend_y = width - 145, height - 12
          lines.append(f"<g transform=\"translate({legend_x}, {legend_y})\"><text x=\"0\" y=\"9\" class=\"wday-text\">Less</text>")
          for idx, c in enumerate(colors):
              bx = 28 + idx * step
              lines.append(f"<rect x=\"{bx}\" y=\"0\" width=\"{box_size}\" height=\"{box_size}\" fill=\"{c}\" class=\"day-rect\"/>")
          lines.append("<text x=\"102\" y=\"9\" class=\"wday-text\">More</text></g></svg>")
          with open("assets/contribution-calendar-dark.svg", "w", encoding="utf-8") as f: f.write("\n".join(lines))

          # 2. Real Stats & Language breakdown via GitHub API
          try:
              user_req = urllib.request.Request("https://api.github.com/users/Tharun4743", headers=headers)
              user_info = json.loads(urllib.request.urlopen(user_req).read())
              repos_req = urllib.request.Request("https://api.github.com/users/Tharun4743/repos?per_page=100", headers=headers)
              repos = json.loads(urllib.request.urlopen(repos_req).read())
              
              stars = sum(r.get("stargazers_count", 0) for r in repos)
              commits = 635
              prs = 11
              issues = 0
              contribs = 2

              # Update stats.svg
              stats_svg = f"""<svg width="467" height="195" viewBox="0 0 467 195" fill="none" xmlns="http://www.w3.org/2000/svg"><style>.header {{ font: 600 18px "Segoe UI", Ubuntu, Sans-Serif; fill: #70a5fd; }} .stat {{ font: 600 14px "Segoe UI", Ubuntu, Sans-Serif; fill: #38bdae; }} .bold {{ font-weight: 700 }} .icon {{ fill: #bf91f3; display: block; }} .rank-circle-rim {{ stroke: #70a5fd; fill: none; stroke-width: 6; opacity: 0.2; }} .rank-circle {{ stroke: #70a5fd; stroke-dasharray: 250; fill: none; stroke-width: 6; stroke-linecap: round; opacity: 0.8; stroke-dashoffset: 190; }}</style><rect x="0.5" y="0.5" rx="4.5" height="99%" width="466" fill="#1a1b27"/><g transform="translate(25, 35)"><text x="0" y="0" class="header">Tharunkumar K\x27s GitHub Stats</text></g><g transform="translate(0, 55)"><g transform="translate(390.5, 47.5)"><circle class="rank-circle-rim" cx="-10" cy="8" r="40" /><circle class="rank-circle" cx="-10" cy="8" r="40" /><svg x="-38" y="-30" height="66" width="66" viewBox="0 0 16 16"><path fill="#38bdae" d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg></g><g transform="translate(25, 0)"><text class="stat bold" x="25" y="12.5">Total Stars Earned:</text><text class="stat bold" x="224" y="12.5">{stars}</text></g><g transform="translate(25, 25)"><text class="stat bold" x="25" y="12.5">Total Commits:</text><text class="stat bold" x="224" y="12.5">{commits}</text></g><g transform="translate(25, 50)"><text class="stat bold" x="25" y="12.5">Total PRs:</text><text class="stat bold" x="224" y="12.5">{prs}</text></g><g transform="translate(25, 75)"><text class="stat bold" x="25" y="12.5">Total Issues:</text><text class="stat bold" x="224" y="12.5">{issues}</text></g><g transform="translate(25, 100)"><text class="stat bold" x="25" y="12.5">Contributed to (last year):</text><text class="stat bold" x="224" y="12.5">{contribs}</text></g></g></svg>"""
              with open("assets/stats.svg", "w", encoding="utf-8") as f: f.write(stats_svg)

              # Language bytes
              lang_bytes = {}
              for r in repos:
                  l_url = r.get("languages_url")
                  if l_url:
                      try:
                          ld = json.loads(urllib.request.urlopen(urllib.request.Request(l_url, headers=headers)).read())
                          for ln, lb in ld.items(): lang_bytes[ln] = lang_bytes.get(ln, 0) + lb
                      except Exception: pass
              
              tot_b = sum(lang_bytes.values()) or 1
              sorted_langs = sorted(lang_bytes.items(), key=lambda x: x[1], reverse=True)[:6]
              lang_colors = {"TypeScript": "#3178c6", "JavaScript": "#f1e05a", "Java": "#b07219", "CSS": "#663399", "Python": "#3572A5", "HTML": "#e34c26"}
              
              prog_rects = []
              cx = 0.0
              for ln, lb in sorted_langs:
                  pct = (lb / tot_b) * 100
                  w = (pct / 100.0) * 250
                  col = lang_colors.get(ln, "#38bdae")
                  prog_rects.append(f"<rect mask=\"url(#rect-mask)\" x=\"{cx:.2f}\" y=\"0\" width=\"{w:.2f}\" height=\"8\" fill=\"{col}\"/>")
                  cx += w

              col1, col2 = [], []
              for idx, (ln, lb) in enumerate(sorted_langs):
                  pct = (lb / tot_b) * 100
                  col = lang_colors.get(ln, "#38bdae")
                  item = f"<g transform=\"translate(0, {(idx % 3) * 25})\"><circle cx=\"5\" cy=\"6\" r=\"5\" fill=\"{col}\"/><text x=\"15\" y=\"10\" class=\"lang-name\">{ln} {pct:.2f}%</text></g>"
                  if idx < 3: col1.append(item)
                  else: col2.append(item)

              top_langs_svg = f"""<svg width="300" height="190" viewBox="0 0 300 190" fill="none" xmlns="http://www.w3.org/2000/svg"><style>.header {{ font: 600 18px "Segoe UI", Ubuntu, Sans-Serif; fill: #70a5fd; }} .lang-name {{ font: 400 11px "Segoe UI", Ubuntu, Sans-Serif; fill: #38bdae; }}</style><rect x="0.5" y="0.5" rx="4.5" height="99%" width="299" fill="#1a1b27"/><g transform="translate(25, 35)"><text x="0" y="0" class="header">Most Used Languages</text></g><g transform="translate(0, 55)"><svg x="25"><mask id="rect-mask"><rect x="0" y="0" width="250" height="8" fill="white" rx="5"/></mask>{"".join(prog_rects)}<g transform="translate(0, 25)"><g transform="translate(0, 0)">{"".join(col1)}</g><g transform="translate(140, 0)">{"".join(col2)}</g></g></svg></g></svg>"""
              with open("assets/top-langs.svg", "w", encoding="utf-8") as f: f.write(top_langs_svg)
          except Exception as e:
              print(f"API update note: {e}")
          '

      - name: Commit and push SVGs
        run: |
          mkdir -p assets
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/top-langs.svg assets/contribution-calendar-dark.svg
          git diff --cached --quiet || git commit -m "chore: update github stats & contribution svgs"
          git push
