name: Unified Profile & Telemetry Sync

on:
  schedule:
    - cron: "45 1,7,13,19 * * *" # Runs every 6 hours at minute 45 (avoids top-of-hour congestion)
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/unified-profile-sync.yml'
  workflow_dispatch:
  repository_dispatch:
    types: [profile_sync, webhook]

permissions:
  contents: write

jobs:
  sync-visualizers:
    name: Generate All Multi-Platform Visualizers
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Generate Complete Profile Visualizer Suite (Official Marketplace Action)
      - name: 🏙️ Generate Profile Visualizer Suite
        uses: Tharun4743/github-profile-visualizer@v1
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          username: ${{ github.repository_owner }}
          visualizers: 'all'
          theme: 'ocean-light'
          leetcode-username: 'Tharunkumar__K'
          duolingo-username: 'Tharunkumar4743'
          radar-skills: 'Algorithms:0.94,Full Stack:0.96,Distributed:0.88,System Design:0.90,APIs & DBs:0.95'
          output-dir: 'assets'
          filename: 'profile-3d-ocean-light.svg'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      # 2. Generate Multi-Platform GitHub Telemetry & Snake Animations (Zero External Actions)
      - name: 📊 Generate Multi-Platform Telemetry & Snake
        run: node scripts/generate-telemetry.js
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}

      # 3. Single Atomic Commit & Push
      - name: 🚀 Commit & Push All Visualizers
        run: |
          git config user.name "Tharun4743"
          git config user.email "tharunkumark42007@gmail.com"
          git add -A assets/ README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(telemetry): sync profile visualizers [skip ci]"
            git pull origin main --rebase -X theirs || git pull origin main --rebase
            git push origin main
          else
            echo "No visualizer changes detected."
          fi

