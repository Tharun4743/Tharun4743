name: Unified Profile & Telemetry Sync

on:
  schedule:
    - cron: "0 0,6,12,18 * * *" # Runs every 6 hours
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/unified-profile-sync.yml'
  workflow_dispatch:
  repository_dispatch:
    types: [profile_sync, webhook]

permissions:
  contents: write

jobs:
  sync-visualizers:
    name: Generate All Multi-Platform Visualizers
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Generate Complete Profile Visualizer Suite (Official Marketplace Action)
      - name: 🏙️ Generate Profile Visualizer Suite
        uses: Tharun4743/github-profile-visualizer@v1
        with:
          username: ${{ github.repository_owner }}
          visualizers: 'all'
          theme: 'cyberpunk'
          leetcode-username: 'Tharunkumar__K'
          radar-skills: 'Algorithms:0.94,Full Stack:0.96,Distributed:0.88,System Design:0.90,APIs & DBs:0.95'
          output-dir: 'assets'
          filename: 'profile-3d-city.svg'
          generate-all: 'true'

      # 2. Generate Multi-Platform GitHub Telemetry
      - name: 📊 Generate Multi-Platform Telemetry
        run: node scripts/generate-telemetry.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}

      # 3. Single Atomic Commit & Push
      - name: 🚀 Commit & Push All Visualizers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --cached --quiet; then
            echo "No visualizer changes detected."
          else
            git commit -m "chore(telemetry): sync profile visualizers via marketplace action [skip ci]"
            git pull --rebase origin main
            git push
          fi
