name: Autonomous Daily Contribution & Self-Updating Maintenance Engine

on:
  schedule:
    # --------------------------------------------------------------------------
    # Distributed Execution Schedule: 8 intervals daily (~25 commits per cycle)
    # Primary Execution: 03:30 UTC = 09:00 AM IST
    # Additional Cycles: 06:30, 09:30, 12:30, 15:30, 18:30, 21:30, 00:30 UTC
    # Total daily capacity: 8 runs * 25 verified improvements = 200 legitimate commits
    # --------------------------------------------------------------------------
    - cron: '30 3,6,9,12,15,18,21,0 * * *'

  workflow_dispatch:
    inputs:
      max_commits:
        description: 'Maximum verified commits for this execution cycle'
        required: false
        default: '25'
        type: string
      dry_run:
        description: 'Simulate inspection without committing or pushing'
        required: false
        default: false
        type: boolean

# Prevent overlapping runs across concurrent triggers
concurrency:
  group: autonomous-contribution-engine
  cancel-in-progress: false

# Enforce strict least-privilege security permissions
permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  GIT_AUTHOR_NAME: "Tharun4743"
  GIT_AUTHOR_EMAIL: "tharunkumark42007@gmail.com"
  GIT_COMMITTER_NAME: "Tharun4743"
  GIT_COMMITTER_EMAIL: "tharunkumark42007@gmail.com"

jobs:
  autonomous-maintenance:
    name: Execute Autonomous Repository Inspection & Maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Step 1: Secure Checkout with full history
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # Step 2: Configure Git Identity & Environment
      - name: Configure Git Identity
        run: |
          git config --global user.name "${{ env.GIT_AUTHOR_NAME }}"
          git config --global user.email "${{ env.GIT_AUTHOR_EMAIL }}"
          git config --global pull.rebase false
          chmod +x scripts/maintenance.sh

      # Step 3: Syntax Verification & Self-Integrity Pre-Flight Check
      - name: Run Pre-Flight Shell Syntax Audit
        run: |
          echo "🔍 Auditing shell script syntax before execution..."
          bash -n scripts/maintenance.sh
          echo "✅ Shell script syntax verification: PASSED"

      # Step 4: Execute Autonomous Contribution Engine
      - name: Run Autonomous Contribution Engine
        env:
          MAX_COMMITS_PER_RUN: ${{ inputs.max_commits || '25' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Launching Autonomous Maintenance Engine..."
          ./scripts/maintenance.sh

      # Step 5: Safe Atomic Push with Conflict Resolution
      - name: Push Validated Commits to Default Branch
        if: ${{ inputs.dry_run != true }}
        run: |
          echo "📦 Verifying local commits against remote..."
          git pull origin main --rebase -X theirs || git pull origin main --rebase || true

          # Inspect diff to ensure zero secrets before network push
          if git log -1 --stat | grep -qE "ghp_[A-Za-z0-9]{30,}|xkeysib-[a-zA-Z0-9]{64}|-----BEGIN [A-Z ]*PRIVATE KEY-----"; then
            echo "🚨 ABORT: Potential secret detected in recent commit! Halting push."
            exit 1
          fi

          git push origin main
          echo "✅ Successfully synchronized all validated maintenance commits with origin."

      # Step 6: Generate GitHub Step Summary Report
      - name: Generate Execution Telemetry Summary
        if: always()
        run: |
          echo "### 📊 Autonomous Maintenance Run Report" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Execution Time** | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger Event** | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Actor** | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Latest Commit** | \`$(git rev-parse --short HEAD)\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Recent Ledger Entries from \`CONTRIBUTION_HISTORY.md\`:" >> $GITHUB_STEP_SUMMARY
          echo '```markdown' >> $GITHUB_STEP_SUMMARY
          tail -n 10 CONTRIBUTION_HISTORY.md >> $GITHUB_STEP_SUMMARY || echo "No entries yet" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
